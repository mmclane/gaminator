[project]
name = "gaminator"
version = "0.1.0"
description = "The Gameinator 3000: one Discord bot that hosts several server games (Assassin, Imposter, ...)"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.7,<3",
  "aiosqlite>=0.20",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:'audioop' is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaminator"]
